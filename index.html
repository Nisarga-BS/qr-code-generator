<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">QR Code Generator</div>
    <nav>
      <a href="index.html">Home</a>
      <a href="index.html">QR Generator</a>
      <a href="about.html">About</a>
    </nav>
    <button class="logout-btn">Logout</button>
  </header>

  <!-- ===== MAIN CONTAINER ===== -->
  <div class="container">
    <h2>Generate Your QR Code</h2>
    <p>Enter text or URL below</p>

    <div class="input-box">
      <input type="text" id="qrText" placeholder="Enter text or URL">
      <button onclick="generateQR()">Generate</button>
    </div>

    <div id="qrResult">
      <img id="qrImage" src="" alt="Your QR Code will appear here">
    </div>

    <button id="downloadBtn" class="download-btn" style="display:none;" onclick="downloadQR()">Download QR Code</button>
  </div>

  <!-- ===== SCRIPT ===== -->
  <script>
    function generateQR() {
      let qrText = document.getElementById("qrText").value.trim();
      let qrImage = document.getElementById("qrImage");
      let downloadBtn = document.getElementById("downloadBtn");

      if (qrText === "") {
        alert("Please enter some text or a URL.");
        return;
      }

      qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=" + encodeURIComponent(qrText);
      qrImage.onload = () => {
        downloadBtn.style.display = "inline-block";
      };
    }

    function downloadQR() {
      let qrImage = document.getElementById("qrImage");
      let link = document.createElement("a");
      link.href = qrImage.src;
      link.download = "QRCode.png";
      link.click();
    }
  </script>

</body>
</html>
